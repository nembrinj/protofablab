<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1600 630" width="1600" height="630" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Physical setup: robot drives beside the walking path, a little ahead of the walker</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M5,0 L5,10" stroke="#6b7280" stroke-width="1.5"/>
    </marker>
    <style>
      .t { font-size: 20px; fill: #111827; }
      .b { font-size: 22px; font-weight: 700; fill: #111827; }
      .s { font-size: 17px; fill: #4b5563; }
      .dimline { stroke: #6b7280; stroke-width: 1.5; }
    </style>
  </defs>
  <rect y="90" width="1600" height="630" fill="#ffffff"/>

  <!-- Camera field of view, pointing straight to the side -->
  <polygon points="800,425 657,220 943,220" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <line x1="800" y1="425" x2="800" y2="232" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- Walking path -->
  <line x1="250" y1="220" x2="1350" y2="220" stroke="#9ca3af" stroke-width="3" stroke-dasharray="14 10"/>
  <path d="M300,205 L1290,205" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1290,235 L300,235" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1300,205 A15,15 0 0 1 1300,235" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M290,235 A15,15 0 0 1 290,205" stroke="#374151" stroke-width="2" fill="none"/>
  <text class="b" x="250" y="140">Walking path · about 10 m · the patient walks back and forth</text>

  <!-- Patient -->
  <circle cx="720" cy="220" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="s" x="720" y="178" text-anchor="middle">patient, walking →</text>

  <!-- A little ahead -->
  <line class="dimline" x1="720" y1="268" x2="800" y2="268" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <rect x="700" y="278" width="120" height="22" fill="#ffffff"/>
  <text class="s" x="760" y="295" text-anchor="middle">a little ahead</text>

  <!-- Side distance -->
  <line class="dimline" x1="1250" y1="220" x2="1250" y2="450" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text class="t" x="1265" y="340">≈ 1.5–2.5 m</text>
  <text class="s" x="1265" y="364">set in tests</text>

  <!-- Robot -->
  <circle cx="800" cy="450" r="32" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="788" y="410" width="24" height="16" rx="3" fill="#2563eb"/>
  <path d="M845,450 L1000,450" stroke="#374151" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="s" x="1012" y="445">drives along,</text>
  <text class="s" x="1012" y="467">at the walker's speed</text>
  <text class="b" x="800" y="525" text-anchor="middle">Robot · camera points straight to the side</text>
  <text class="s" x="800" y="552" text-anchor="middle">walk there: drives forward · walk back: drives backward</text>
  <text class="s" x="800" y="576" text-anchor="middle">stage 1: parked at the same distance</text>

  <text class="s" x="250" y="680" font-style="italic">The robot stays a little ahead, so the camera sees the legs slightly from the front. Distances approximate; robot not to scale.</text>
</svg>
