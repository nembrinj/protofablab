<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>System architecture: robot, laptop and dashboard stack</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .group { stroke: #d1d5db; stroke-width: 1.5; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .ours { fill: #ffffff; stroke: #2563eb; stroke-width: 2.5; }
      .matin { fill: #ffffff; stroke: #9333ea; stroke-width: 2.5; }
      .agree { fill: #ffffff; stroke: #0d9488; stroke-width: 2.5; stroke-dasharray: 8 5; }
      .existing { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .person { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .name { font-family: Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #111827; }
      .plain { font-size: 18px; font-weight: 700; fill: #111827; }
      .sub { font-size: 14px; fill: #4b5563; }
      .edge { stroke: #374151; stroke-width: 2; fill: none; }
      .label { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
      .note { font-size: 15px; fill: #6b7280; font-style: italic; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>

  <!-- Groups -->
  <rect class="group" x="40" y="150" width="400" height="660" rx="14" fill="#eff6ff"/>
  <text class="title" x="60" y="185">Robot · Raspberry Pi</text>
  <rect class="group" x="640" y="150" width="560" height="660" rx="14" fill="#f9fafb"/>
  <text class="title" x="660" y="185">Laptop · ROS 2 Jazzy</text>
  <rect class="group" x="1260" y="150" width="300" height="570" rx="14" fill="#f0fdf4"/>
  <text class="title" x="1280" y="185">Docker Compose · laptop</text>
  <text class="note" x="540" y="140" text-anchor="middle">Wi-Fi · ROS 2</text>
  <line x1="540" y1="150" x2="540" y2="810" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- People -->
  <rect class="person" x="70" y="40" width="340" height="56" rx="28"/>
  <text class="plain" x="240" y="75" text-anchor="middle">Patient walks back and forth</text>
  <rect class="person" x="1290" y="750" width="240" height="56" rx="28"/>
  <text class="plain" x="1410" y="785" text-anchor="middle">Physio</text>

  <!-- Robot nodes -->
  <rect class="existing" x="70" y="220" width="340" height="80" rx="10"/>
  <text class="name" x="90" y="253">usb_cam</text>
  <text class="sub" x="90" y="280">USB webcam on 3D-printed mount</text>

  <rect class="matin" x="70" y="380" width="340" height="80" rx="10"/>
  <text class="name" x="90" y="413">audio_cues</text>
  <text class="sub" x="90" y="440">USB speaker · spoken feedback</text>

  <rect class="existing" x="70" y="540" width="340" height="120" rx="10"/>
  <text class="name" x="90" y="573">turtlebot3_bringup</text>
  <text class="sub" x="90" y="600">LiDAR · motors · odometry</text>

  <!-- Laptop nodes -->
  <rect class="matin" x="670" y="220" width="240" height="80" rx="10"/>
  <text class="name" x="690" y="253">gait_monitor</text>
  <text class="sub" x="690" y="280">pose → legs in view, steps</text>

  <rect class="agree" x="950" y="220" width="220" height="80" rx="10"/>
  <text class="name" x="970" y="253">clip_recorder</text>
  <text class="sub" x="970" y="280">records · cuts clips</text>

  <rect class="ours" x="670" y="380" width="240" height="80" rx="10"/>
  <text class="name" x="690" y="413">walk_session</text>
  <text class="sub" x="690" y="440">session flow · flags moments</text>

  <rect class="ours" x="950" y="380" width="220" height="80" rx="10"/>
  <text class="name" x="970" y="413">session_reporter</text>
  <text class="sub" x="970" y="440">ROS 2 → MQTT JSON</text>

  <rect class="ours" x="670" y="540" width="240" height="80" rx="10"/>
  <text class="name" x="686" y="573" font-size="15">lidar_person_tracker</text>
  <text class="sub" x="686" y="600">position, speed, steps</text>

  <rect class="ours" x="950" y="540" width="220" height="80" rx="10"/>
  <text class="name" x="970" y="573">walker_follower</text>
  <text class="sub" x="970" y="600">stage 2 · drives beside</text>

  <rect class="existing" x="670" y="700" width="240" height="80" rx="10"/>
  <text class="name" x="690" y="733">Nav2 · SLAM</text>
  <text class="sub" x="690" y="760">later · map, drive to start</text>

  <!-- Dashboard nodes -->
  <rect class="existing" x="1290" y="228" width="240" height="64" rx="10"/>
  <text class="plain" x="1310" y="257">Web server</text>
  <text class="sub" x="1310" y="279">clip files</text>
  <rect class="existing" x="1290" y="330" width="240" height="64" rx="10"/>
  <text class="plain" x="1310" y="359">Mosquitto</text>
  <text class="sub" x="1310" y="381">MQTT broker</text>
  <rect class="existing" x="1290" y="432" width="240" height="64" rx="10"/>
  <text class="plain" x="1310" y="461">Telegraf</text>
  <text class="sub" x="1310" y="483">MQTT → database</text>
  <rect class="existing" x="1290" y="534" width="240" height="64" rx="10"/>
  <text class="plain" x="1310" y="563">InfluxDB</text>
  <text class="sub" x="1310" y="585">results over time</text>
  <rect class="existing" x="1290" y="636" width="240" height="64" rx="10"/>
  <text class="plain" x="1310" y="665">Grafana</text>
  <text class="sub" x="1310" y="687">dashboard, links to clips</text>

  <!-- Edges: patient and robot -->
  <path class="edge" d="M380,96 L380,220" marker-end="url(#arrow)"/>
  <text class="sub" x="372" y="130" text-anchor="end">filmed</text>
  <path class="edge" d="M70,420 L55,420 L55,68 L70,68" marker-end="url(#arrow)"/>
  <text class="sub" x="62" y="125">hears</text>

  <!-- Edges: robot to laptop -->
  <path class="edge" d="M410,260 L670,260" marker-end="url(#arrow)"/>
  <rect x="425" y="268" width="230" height="18" fill="#ffffff"/>
  <text class="label" x="540" y="282" text-anchor="middle">/camera/image_raw/compressed</text>
  <path class="edge" d="M620,260 L620,203 L1060,203 L1060,220" marker-end="url(#arrow)"/>

  <path class="edge" d="M670,420 L410,420" marker-end="url(#arrow)"/>
  <rect x="470" y="396" width="140" height="18" fill="#ffffff"/>
  <text class="label" x="540" y="410" text-anchor="middle">/session/cue</text>

  <path class="edge" d="M410,570 L670,570" marker-end="url(#arrow)"/>
  <rect x="505" y="546" width="70" height="18" fill="#ffffff"/>
  <text class="label" x="540" y="560" text-anchor="middle">/scan</text>

  <path class="edge" d="M1060,620 L1060,645 L410,645" marker-end="url(#arrow)"/>
  <rect x="490" y="621" width="100" height="18" fill="#ffffff"/>
  <text class="label" x="540" y="635" text-anchor="middle">/cmd_vel</text>

  <path class="edge" d="M240,660 L240,740 L670,740" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="425" y="716" width="230" height="18" fill="#ffffff"/>
  <text class="label" x="540" y="730" text-anchor="middle">/scan · /odom · /cmd_vel</text>

  <!-- Edges: inside the laptop -->
  <path class="edge" d="M790,300 L790,380" marker-end="url(#arrow)"/>
  <text class="label" x="780" y="335" text-anchor="end">/gait/steps</text>
  <text class="label" x="780" y="353" text-anchor="end">/gait/state</text>

  <path class="edge" d="M880,380 L880,340 L1030,340 L1030,300" marker-end="url(#arrow)"/>
  <text class="label" x="955" y="332" text-anchor="middle">/session/moment</text>

  <path class="edge" d="M910,420 L950,420" marker-end="url(#arrow)"/>
  <text class="label" x="930" y="482" text-anchor="middle">/session/walk_summary</text>
  <text class="label" x="930" y="499" text-anchor="middle">/session/moment</text>

  <path class="edge" d="M760,540 L760,460" marker-end="url(#arrow)"/>
  <text class="label" x="750" y="505" text-anchor="end">/person/state</text>
  <path class="edge" d="M910,580 L950,580" marker-end="url(#arrow)"/>

  <!-- Edges: laptop to dashboard -->
  <path class="edge" d="M1170,260 L1290,260" marker-end="url(#arrow)"/>
  <text class="label" x="1230" y="252" text-anchor="middle">clips</text>
  <path class="edge" d="M1170,420 L1230,420 L1230,362 L1290,362" marker-end="url(#arrow)"/>
  <rect x="1208" y="378" width="44" height="18" fill="#ffffff"/>
  <text class="label" x="1230" y="392" text-anchor="middle">MQTT</text>
  <path class="edge" d="M1410,394 L1410,432" marker-end="url(#arrow)"/>
  <path class="edge" d="M1410,496 L1410,534" marker-end="url(#arrow)"/>
  <path class="edge" d="M1410,598 L1410,636" marker-end="url(#arrow)"/>
  <path class="edge" d="M1410,700 L1410,750" marker-end="url(#arrow)"/>
  <path class="edge" d="M1530,260 L1548,260 L1548,778 L1530,778" marker-end="url(#arrow)"/>
  <text class="label" x="1542" y="730" text-anchor="end">clips</text>

  <!-- Legend -->
  <rect class="ours" x="300" y="850" width="36" height="24" rx="5"/>
  <text class="sub" x="348" y="868" font-size="16">Leonid: LiDAR, driving, session logic, dashboard</text>
  <rect class="matin" x="760" y="850" width="36" height="24" rx="5"/>
  <text class="sub" x="808" y="868" font-size="16">Matin: camera, audio</text>
  <rect class="agree" x="990" y="850" width="36" height="24" rx="5"/>
  <text class="sub" x="1038" y="868" font-size="16">to agree</text>
  <rect class="existing" x="1150" y="850" width="36" height="24" rx="5"/>
  <text class="sub" x="1198" y="868" font-size="16">existing software</text>
  <text class="note" x="800" y="905" text-anchor="middle">Stage 1: the robot is parked, so walker_follower is not used. Nav2 comes later. Built so far: lidar_person_tracker (position, speed).</text>
</svg>
