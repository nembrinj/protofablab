lidar_person_tracker:
  ros__parameters:
    # static: the robot stays parked. driving: the walker is found while the
    # robot is parked, then followed with the odometry while it drives.
    # Can be changed while the node runs: ros2 param set /lidar_person_tracker mode driving
    mode: "static"

    # The strip of floor that is watched, seen from the LiDAR.
    # The defaults watch from 0.5 m to 3.5 m in front of the robot.
    path_distance_m: 2.0        # from the robot to the middle of the strip
    corridor_half_width_m: 1.5  # from the middle of the strip to its near and far edge
    zone_half_length_m: 2.5     # how far along the line, each side of the robot
    # facing_angle_rad, the direction of the path in the scan (0 is the robot's
    # front), is set with the launch argument: facing_angle_rad:=3.14159

    # Learning the empty room.
    background_scans: 15        # scans to learn from (about 2 s at 9 scans per second)
    background_margin_m: 0.2    # how much nearer than the empty room counts as new

    # Grouping points into people.
    person_gap_m: 0.8           # a wider gap along the path means two people
    min_points: 2               # fewer points than this is noise

    # Walking speed.
    speed_window_s: 1.0         # the speed is fitted over this much time
    min_speed_span_s: 0.4       # no speed before this much time is covered
    max_jump_m: 1.0             # a bigger jump between two scans restarts the speed

    # Steps: the walker's feet are apart, then close up again.
    step_drop_m: 0.12           # how much the feet must close up after being apart
    step_min_move_m: 0.15       # how far the walker must have moved on since the feet were last apart
    step_max_spread_m: 1.0      # points spread wider than this are not two feet; the scan is skipped

    # Driving mode.
    follow_radius_m: 0.6        # the walker's points are looked for this close to where the walker should be
    follow_lost_s: 1.0          # no points there for this long, and the walker is lost
    # The empty room is only used while the robot is this close to where it learned it.
    # The heading in the odometry can drift a little while the robot stands still.
    parked_m: 0.05
    parked_rad: 0.1             # about 6 degrees

    scan_timeout_s: 2.0         # warn when no scan or, in driving mode, no odometry arrives for this long
