# The physiotherapist's dashboard: the walk results arrive over MQTT, are
# stored in InfluxDB, and are shown in Grafana. For the local network only:
# the broker and the database have no logins, so the repository holds no passwords.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "1883:1883"  # reached by the ROS 2 computer over the network
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  influxdb:
    image: influxdb:1.8.10
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=rehab
      - INFLUXDB_REPORTING_DISABLED=true
    ports:
      - "127.0.0.1:8086:8086"  # this computer only, to look at the stored data
    volumes:
      - influxdb-data:/var/lib/influxdb

  telegraf:
    image: telegraf:1.32.3
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true  # anyone on the network can look, not change
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/walks.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  influxdb-data:
  grafana-data:
