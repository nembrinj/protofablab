# Reads the walk results from MQTT and writes them to InfluxDB.
# Each walk is stored at the time it arrives (the laptop's clock).

[agent]
  interval = "10s"
  flush_interval = "1s"
  omit_hostname = true

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "rehab"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["rehab/+/walk"]
  qos = 1
  topic_tag = ""
  data_format = "json_v2"

  # rehab/<patient_id>/walk: the measurement "walk", tagged with the patient ID.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "rehab/+/+"
    measurement = "_/_/measurement"
    tags = "_/patient_id/_"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "session_id"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "walk"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "measured"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "duration_s"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "steps"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stops"
      type = "int"
    # Left out of the message when unknown.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cadence_spm"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "speed_mps"
      type = "float"
      optional = true
